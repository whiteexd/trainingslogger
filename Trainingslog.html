<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F4F1;
    --mut:rgba(244,244,241,.6);
    --line:rgba(255,255,255,.08);
    --acc:#8B5CF6; /* Schönes Lila */
    --accTx:#C4B5FD;
    --accInk:#fff;
    --bg-card:#141414;
    --bg-input:#1C1C1E;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#000; height:100%}
  
  /* Hintergrund: Ersetzt das kaputte Video durch einen schönen, weichen Farbverlauf */
  #bgv2{position:fixed;inset:0;width:100%;height:100%;z-index:-2;background:radial-gradient(circle at 50% 0%, #2e1065 0%, #000 70%);pointer-events:none}
  
  body{margin:0;color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;font-weight:500;-webkit-font-smoothing:antialiased;background:transparent}
  
  main{max-width:520px;margin:0 auto;padding:24px 16px 100px}
  
  /* Typografie */
  h1{font:700 36px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.5px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:15px}
  
  /* Navigation (Segmented Control Look) */
  .nav{display:flex;gap:4px;margin:0 0 24px;padding:4px;background:var(--bg-card);border-radius:16px;border:1px solid var(--line)}
  .nav .btn{flex:1;padding:10px 2px;font-size:14px;background:transparent;color:var(--mut);border-radius:12px;transition:all .2s}
  .nav .btn.pri{background:var(--acc);color:var(--accInk);font-weight:600;box-shadow:0 2px 10px rgba(139,92,246,.3)}
  
  /* Wochen-Auswahl */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
  .week button{border:0;background:transparent;color:var(--ink);border-radius:14px;padding:10px 0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
  .week button:active{transform:scale(.96)}
  .week b{font:600 16px "Barlow",sans-serif}
  .week small{font-size:11px;color:var(--mut);font-weight:500}
  .week .rest{opacity:.5}
  .week .on{background:var(--acc);color:var(--accInk)}
  .week .on small{color:var(--accInk);opacity:.8}
  .week .done b::after{content:"✓";font-size:11px;margin-left:2px;color:var(--accTx)}
  .week .on.done b::after{color:var(--accInk)}
  
  /* Karten */
  .ex,.today,.mt,.btn.cr{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  
  .ex h2{font:600 20px/1.2 "Barlow",sans-serif;margin:0 0 16px;letter-spacing:.2px}
  .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .hd h2{margin:0}
  .hd .btn{min-width:44px;padding:8px 12px;border-radius:12px;background:var(--bg-input)}
  .hd+.cv{color:var(--accTx);font-size:14px;font-weight:600}
  
  /* Sätze (Sets) */
  .set{display:grid;grid-template-columns:24px 1fr 16px 1fr 40px;gap:8px;align-items:start;margin-bottom:12px}
  .set span{color:var(--mut);padding-top:14px;font-size:15px;text-align:center}
  .set i{font-style:normal;color:var(--mut);text-align:center;padding-top:13px}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--bg-input);border:1px solid transparent;border-radius:14px;padding:14px;width:100%;outline:0;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--accTx);background:#222}
  input::placeholder,textarea::placeholder{color:rgba(244,244,241,.3)}
  .set input{text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:12px 4px;min-width:0}
  .set input.auto{color:var(--mut)}
  select option{background:#1B1C1F;color:#fff}
  .cv{display:block;text-align:center;color:var(--mut);font-size:13px;min-height:14px;margin-top:4px}
  
  /* Buttons */
  .row{display:flex;gap:10px;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--bg-input);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;transition:transform .12s,background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--acc);color:var(--accInk);border-color:transparent;box-shadow:0 4px 14px rgba(139,92,246,.25)}
  .btn.wu{padding:14px 0;min-width:0;border-radius:12px;font-size:14px;background:var(--bg-input)}
  .btn.wu.on{background:var(--acc);color:var(--accInk)}
  .btn.st{padding:0;width:34px;height:48px;flex:none;font-size:20px;line-height:1;border-radius:12px}
  
  /* Aufwärmen & Notiz */
  .note{margin:0 0 14px;padding:12px 14px;font-size:14px;text-align:left;border-radius:14px}
  
  /* Statistik Kacheln */
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .mt{background:var(--bg-card);border-radius:20px;padding:16px;border:1px solid var(--line);margin-bottom:0}
  .mt small{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
  .mt b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif}
  .mt b span{font:500 13px Barlow,sans-serif;color:var(--mut)}
  .bar{height:8px;border-radius:4px;background:var(--bg-input);overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
  
  /* Liste (Lebensmittel etc.) */
  .fe{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .fe:last-child{border-bottom:0}
  .fe span:first-child{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
  .fe span:nth-child(2){color:var(--mut);font-size:13px;text-align:right;margin-right:8px}
  .btn.x{padding:6px 12px;font-size:16px;line-height:1;background:rgba(255,255,255,.05);border-radius:10px;flex:none}
  
  /* Kalender & Charts */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
  .cal b{font-weight:500;color:var(--mut);font-size:12px}
  .cd{padding:10px 0;border-radius:10px;font-variant-numeric:tabular-nums;color:var(--mut)}
  .cd.on{background:var(--acc);color:var(--accInk);font-weight:600}
  .cd.td{box-shadow:inset 0 0 0 2px var(--accTx)}
  .cd.sk{background:rgba(240,170,70,.2);color:#F0AA46}
  .ch{background:var(--bg-input);border-radius:16px;padding:16px;margin-top:12px;color:var(--ink)}
  
  /* Restday & Chips */
  .restbox{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:40px 20px;text-align:center;color:var(--mut);margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .btn.chip{padding:10px 16px;font-size:14px;border-radius:20px;background:var(--bg-input);border:1px solid var(--line)}
  .btn.cr{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 12px;padding:16px 20px;border-radius:20px;font-size:16px;box-shadow:none}
  .btn.cr small{color:var(--mut);font-weight:500;font-size:13px}
  .btn.cr.on{background:rgba(139,92,246,.15);border-color:var(--acc)}
  .btn.cr.on small{color:var(--accTx)}
  
  /* Header Widgets */
  .today{display:flex;flex-wrap:wrap;gap:8px 16px;padding:16px 20px;font-size:14px;margin-bottom:16px}
  .today b{font-weight:700;font-size:15px;width:100%;margin-bottom:4px;color:var(--accTx)}
  .today span{display:flex;align-items:center;gap:4px}
  .lnk{background:none;border:0;color:var(--accTx);font:inherit;padding:0;text-decoration:underline;cursor:pointer}
  
  /* Sonstiges */
  .wk{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;margin-bottom:12px}
  .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .th{border:0;background:none;padding:0;color:var(--mut);font:inherit;font-size:12px;border-radius:12px;overflow:hidden}
  .th img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
  .th.on img{outline:3px solid var(--accTx)}
  .prx{margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .prx:last-child{border:0;margin:0;padding:0}
  .prx .hd b{font:600 18px/1.1 "Barlow",sans-serif}
  .sec{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--ink);padding:0;font:inherit;text-align:left;cursor:pointer}
  .sec h2{margin:0;font-size:20px}.sec span{color:var(--mut);font-size:18px}
  .sb{margin-top:20px}.sb>label:first-child{margin-top:0}
  label{display:block;margin:16px 0 8px;color:var(--mut);font-size:14px}
  .fe[data-sel]{cursor:pointer}.fe.sel{background:rgba(139,92,246,.15);border-radius:12px;padding-left:12px;padding-right:12px;border-color:transparent}
  
  /* Toast & Undo */
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-160%);background:var(--acc);color:var(--accInk);padding:14px 20px;border-radius:16px;font-weight:600;z-index:10;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(139,92,246,.4)}
  #toast.show{transform:translate(-50%,0)}
  #undo{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,200%);display:flex;gap:14px;align-items:center;background:#222;color:#fff;padding:12px 16px 12px 20px;border-radius:16px;z-index:11;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.6);white-space:nowrap;border:1px solid var(--line)}
  #undo.show{transform:translate(-50%,0)}
  #undo button{background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:600}
  
  @keyframes glow{0%{box-shadow:0 8px 24px rgba(0,0,0,.3)}25%{box-shadow:0 0 0 3px var(--accTx),0 0 40px rgba(139,92,246,.6)}100%{box-shadow:0 8px 24px rgba(0,0,0,.3)}}.ex.pop{animation:glow 1.8s ease-out}
  @keyframes sl{from{opacity:0;transform:translateX(var(--sx,30px))}to{opacity:1;transform:none}}#app.sw{animation:sl .22s ease-out}
</style>
</head>
<body>
<div id="bgv2"></div>
<main>
<h1 id="t">Trainingslog</h1>
<p class="sub" id="d"></p>
<div class="nav"><button class="btn pri" id="nl">Log</button><button class="btn" id="ns">Statistik</button><button class="btn" id="ne">Essen</button><button class="btn" id="np">Plan</button></div>
<div id="app"></div>
</main>

<script>
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const LONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const DEF={plan:{Upper:['Schrägbankdrücken','Latzug','Schulterdrücken','Rudern','Seitheben','Butterfly'],Lower:['Kniebeuge','Rumänisches Kreuzheben','Beinpresse','Beinbeuger','Wadenheben']},cycle:['Upper','Lower','Upper','Rest'],anchor:{date:'2026-10-08',idx:1},logs:{}};
let S=null;
try{S=JSON.parse(localStorage.getItem('tl')||'null')}catch(e){}
if(!S||!S.plan||!S.logs)S=JSON.parse(JSON.stringify(DEF));
if(!S.cycle||!S.anchor){S.cycle=DEF.cycle.slice();S.anchor={...DEF.anchor};delete S.week}
function migrate(){if(!S.chk){S.chk={items:['Kreatin'],days:{}};for(const dk in (S.cr||{}))if(S.cr[dk])S.chk.days[dk]=['Kreatin']}}
migrate();
if(JSON.stringify(S.cycle)==='["Upper","Lower","Upper","Rest","Upper","Lower","Upper"]'){S.cycle=DEF.cycle.slice();S.anchor={...DEF.anchor}}
const toKg=l=>{const n=parseFloat(String(l).replace(',','.'));return isNaN(n)?'':Math.round(n*0.45359237*100)/100};
const toLb=k=>{const n=parseFloat(String(k).replace(',','.'));return isNaN(n)?'':Math.round(n/0.45359237*10)/10};
const num=x=>{const n=parseFloat(String(x).replace(',','.'));return isNaN(n)?0:n};
const prText=ex=>{const p=S.pr&&S.pr[ex];return p&&num(p.w)&&num(p.r)?'🏆 Bestwert: '+p.w+' kg × '+p.r:''};
function checkPR(ex,i,date,ei){
  const p0=S.pr&&S.pr[ex];if(!p0)return;
  S.prb=S.prb||{};const key=date+'|'+ex,base=S.prb[key]||{w:p0.w,r:p0.r,d:p0.d};
  if(!num(base.w)||!num(base.r))return;
  const ws=((S.logs[date]||{})[ex]||[]).filter(work);
  const hl=S.prh=S.prh||{},list=hl[date]=hl[date]||[],el=document.getElementById('pr'+ei);
  const best=ws.length?ws.reduce((a,b)=>num(b.w)>num(a.w)||(num(b.w)===num(a.w)&&num(b.r)>num(a.r))?b:a):null;
  const beats=best&&(num(best.w)>num(base.w)||(num(best.w)===num(base.w)&&num(best.r)>num(base.r)));
  if(beats){const changed=!(String(p0.w)===String(best.w)&&String(p0.r)===String(best.r));S.prb[key]=base;S.pr[ex]={w:String(best.w),r:String(best.r),d:iso(new Date())};if(!list.includes(ex))list.push(ex);save();if(el)el.textContent=prText(ex)+'  (neu!)';if(changed)celebrate(ex,best.w,best.r,ei)}
  else if(S.prb[key]){S.pr[ex]=S.prb[key];delete S.prb[key];hl[date]=list.filter(x=>x!==ex);save();if(el)el.textContent=prText(ex)}
}
const fmt=n=>String(n).replace('.',',');
const G=[['Brust',/brust|bank|butterfly|flieg|chest|dips/i],['Rücken',/latzug|rudern|klimm|zug|row|pulldown/i],['Schultern',/schulter|seitheb|face|delta/i],['Beine',/bein|kniebeug|squat|wade|kreuzheb|adukt|abdukt|hack|gesäß/i],['Arme',/bizeps|trizeps|curl|arm/i]];
const grp=ex=>{for(const[g,r]of G)if(r.test(ex))return g;return'Sonstige'};
const work=s=>s&&!s.wu&&num(s.w)&&num(s.r);
const lab=d=>d.slice(8)+'.'+d.slice(5,7)+'.';
function sugg(ex,date){const l=last(ex,date).filter(work);if(!l.length)return'';const P={reps:8,step:2.5,...S.prog};const mw=Math.max(...l.map(s=>num(s.w)));return l.every(s=>num(s.r)>=P.reps)?'⬆️ Vorschlag: '+fmt(Math.round((mw+P.step)*100)/100)+' kg':'➡️ Vorschlag: '+fmt(mw)+' kg halten, '+P.reps+' Wdh pro Satz schaffen'}
function toast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.className='show';clearTimeout(t._h);t._h=setTimeout(()=>{t.className=''},3400)}
function celebrate(ex,w,r,ei){clearTimeout(celebrate._t);celebrate._t=setTimeout(()=>celebrate2(ex,w,r,ei),600)}
function celebrate2(ex,w,r,ei){toast('🏆 Neuer Rekord: '+ex+' '+fmt(num(w))+' kg × '+num(r));try{navigator.vibrate&&navigator.vibrate([60,40,120])}catch(e){}const el=document.getElementById('pr'+ei),sec=el&&el.closest('.ex');if(sec){sec.classList.add('pop');setTimeout(()=>sec.classList.remove('pop'),1800)}}
const tmOf=date=>(S.tm||{})[date];
function markStart(date){S.dt=S.dt||{};if(!S.dt[date])S.dt[date]=typeOf(pIso(date));S.tm=S.tm||{};const t=S.tm[date]=S.tm[date]||{};if(!t.s)t.s=Date.now()}
const volOf=k=>{const L=S.logs[k];if(!L)return 0;let v=0;for(const ex in L)for(const s of L[ex])if(work(s))v+=num(s.w)*num(s.r);return v};
function summaryHtml(date){
  const L=S.logs[date]||{},tm=tmOf(date)||{};let sets=0,vol=0;const tops=[];
  for(const ex in L){const ws=L[ex].filter(work);if(!ws.length)continue;sets+=ws.length;ws.forEach(s=>{vol+=num(s.w)*num(s.r)});const top=ws.reduce((a,b)=>num(b.w)>num(a.w)||(num(b.w)===num(a.w)&&num(b.r)>num(a.r))?b:a);tops.push(esc(ex)+': '+fmt(num(top.w))+' kg × '+num(top.r))}
  const dur=tm.s&&tm.e?Math.max(1,Math.round((tm.e-tm.s)/60000)):null,prs=(S.prh||{})[date]||[],t=typeOf(pIso(date));
  let prev=null;Object.keys(S.logs).filter(k=>k<date&&typeOf(pIso(k))===t&&volOf(k)>0).sort().forEach(k=>{prev=k});
  const dv=prev?Math.round((vol/volOf(prev)-1)*100):null,cv='<div class="cv" style="text-align:left;font-size:15px;margin:4px 0">';
  return'<section class="ex"><h2>Training geschafft 💪</h2>'+cv+(dur?'⏱ '+dur+' Min · ':'')+sets+' Arbeitssätze</div>'+cv+'📦 '+Math.round(vol).toLocaleString('de-DE')+' kg Volumen'+(dv!==null?' ('+(dv>=0?'+':'')+dv+' % zu deinem letzten '+t+')':'')+'</div>'+(prs.length?cv+'🏆 '+prs.length+(prs.length===1?' neuer Bestwert: ':' neue Bestwerte: ')+prs.map(esc).join(', ')+'</div>':'')+tops.map(x=>cv+x+'</div>').join('')+'<div class="row"><button class="btn" data-unfin="1">Weiter trainieren</button></div></section>';
}
const ckDone=k=>((S.chk.days||{})[k]||[]);
const ckStreak=nm=>{let n=0;for(let k=(ckDone(iso(today)).includes(nm)?0:1);k<400;k++){const d=new Date(today);d.setDate(d.getDate()-k);if(ckDone(iso(d)).includes(nm))n++;else break}return n};
function crHtml(){return S.chk.items.length?'<div class="ck">'+S.chk.items.map((nm,i)=>{const on=ckDone(iso(today)).includes(nm),n=ckStreak(nm);return'<button class="btn cr'+(on?' on':'')+'" data-ck="'+i+'"><span>'+(on?'✅':'⬜')+' '+esc(nm)+' heute</span><small>'+(n?n+(n===1?' Tag':' Tage')+' in Folge':'noch keine Serie')+'</small></button>'}).join('')+'</div>':''}
function todayHtml(){
  const t=typeOf(today),tot=dayTot(iso(today)),g=goalOf(),done=ckDone(iso(today)).filter(x=>S.chk.items.includes(x)).length,n=streak(),parts=['<b>'+(isSick(today)?'🤒 Krank':t==='Rest'?'Ruhetag':t+' heute')+'</b>'];
  if(tot.k>0||g.k)parts.push('🍽 '+Math.round(tot.k).toLocaleString('de-DE')+(g.k?' / '+Math.round(g.k).toLocaleString('de-DE'):'')+' kcal'+(tot.p>0||g.p?' · E '+Math.round(tot.p)+(g.p?' / '+Math.round(g.p):'')+' g':''));
  if(S.chk.items.length)parts.push('✅ '+done+'/'+S.chk.items.length);
  if(n)parts.push('🔥 '+n);
  if(Object.keys(S.bw||{}).length&&!(S.bw||{})[iso(today)])parts.push('<button class="lnk" data-bwgo="1">⚖️ Gewicht fehlt</button>');
  return'<div class="today">'+parts.map(x=>'<span>'+x+'</span>').join('')+'</div>';
}
function knownEx(){const st=new Set(allEx());Object.values(S.logs).forEach(L=>Object.keys(L).forEach(x=>st.add(x)));return[...st]}
function addExHtml(){return addOpen?'<section class="ex"><label style="margin-top:0">Übung nur für heute hinzufügen</label><div class="row" style="margin:0"><input id="adin" list="adl" placeholder="Name wählen oder tippen"><button class="btn pri" data-adok="1">OK</button></div><datalist id="adl">'+knownEx().map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist></section>':'<button class="btn" data-adopen="1" style="width:100%;margin:0 0 14px">+ Übung für heute</button>'}
const MET={top:'Topgewicht',vol:'Volumen',e1:'Gesch. Max'};let pmet='top';
function save(){try{localStorage.setItem('tl',JSON.stringify(S))}catch(e){}}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pIso=s=>{const a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])};
const dn=d=>Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
let today=new Date(),wd=(today.getDay()+6)%7;
const sickEnd=r=>r.to?dn(pIso(r.to)):dn(today);

function chart(pts){
  if(pts.length<2)return'<div class="cv" style="text-align:left">Noch zu wenig Daten, mindestens 2 Einträge nötig.</div>';
  const W=320,H=140,pl=40,pr=10,pt=10,pb=22;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const ya=y0===y1?y0-1:y0-(y1-y0)*.1,yb=y0===y1?y1+1:y1+(y1-y0)*.1;
  const X=x=>pl+(x1===x0?0:(x-x0)/(x1-x0))*(W-pl-pr),Y=y=>pt+(1-(y-ya)/(yb-ya))*(H-pt-pb);

}

const RAMP={1:[.6],2:[.5,.75],3:[.5,.7,.85],4:[.4,.55,.7,.85],5:[.4,.5,.6,.7,.85]};
function setWarm(ei,mode){
  const cd=wdate(sel),ex=exs(cd)[ei],date=iso(cd),L=S.logs[date]=S.logs[date]||{},a=L[ex]=L[ex]||initSets(ex,date);
  const old=a.filter(x=>x&&x.wu),wk=a.filter(x=>x&&!x.wu),stp=S.lb&&S.lb[ex]?2.2675:2.5,rd=v=>Math.round(Math.round(v/stp)*stp*100)/100;
  const w0=wk.filter(x=>num(x.w)),base=w0.length?Math.max(...w0.map(x=>num(x.w))):0;
  if(mode==='del'){if(old.length)L[ex]=[...old.slice(1),...wk];save();render();return}
  if(!base){toast('Trag zuerst dein Arbeitsgewicht ein.');return}
  markStart(date);
  if(mode==='add'){if(old.length>=5){toast('Mehr als 5 Aufwärmsätze sind nicht vorgesehen.');return}const f=old.length&&num(old[0].w)?num(old[0].w)*.7:base*.4;L[ex]=[{w:String(Math.max(stp,rd(f))),wu:true,auto:true},...old,...wk]}
  else{const n=Math.min(5,Math.max(1,num((S.prog||{}).warm)||1));L[ex]=[...RAMP[n].map(f=>({w:String(Math.max(stp,Math.min(rd(base*f),rd(base)-stp))),wu:true,auto:true})).filter(x=>num(x.w)>0&&num(x.w)<base),...wk]}
  save();render();
}

  if(d.k){const cd=wdate(sel);checkPR(exs(cd)[+d.e],+d.s,iso(cd),+d.e);if(view==='log'&&!app.querySelector('[data-fin],[data-unfin]')&&logged(cd))app.insertAdjacentHTML('beforeend','<button class="btn pri" style="width:100%;margin:2px 0 14px;padding:14px" data-fin="1">Training beenden</button>')}
  if(d.bw!==undefined){S.bw=S.bw||{};const n=num(v);if(n)S.bw[iso(today)]=n;else delete S.bw[iso(today)];save();renderStats()}
  if(d.px!==undefined){pex=v;rerender()}
  if(d.f==='w'&&S.lb&&S.lb[d.x]){const val=toKg(v);S.pr=S.pr||{};const q=S.pr[d.x]=S.pr[d.x]||{w:'',r:''};q.w=String(val);q.d=iso(new Date());e.target.value=val;const c=e.target.nextElementSibling;if(c)c.textContent=val===''?'in lb eingeben':toLb(val)+' lb';save()}
  if(d.ph!==undefined){const f=e.target.files&&e.target.files[0];if(f)readPhoto(f,img=>{P.push({id:Date.now(),d:iso(new Date()),img});if(!savePh())P.pop();renderStats()})}
  if(d.gl!==undefined){S.goal=S.goal||{};S.goal[d.gl]=num(v);save();renderFood()}
  if(d.cy!==undefined){const k=cyIdx(today);S.cycle[+d.cy]=v;setToday(k)}
  if(d.today){setToday(+v-1)}
});
app.addEventListener('click',e=>{

  if(d.day!==undefined){sel=+d.day;swapOpen=-1;addOpen=false;render()}
  else if(d.wk!==undefined){off+=+d.wk;render()}
  else if(d.cal!==undefined){calOff+=+d.cal;renderStats()}
  else if(d.th!==undefined){const id=+d.th;picked=picked.includes(id)?picked.filter(x=>x!==id):[...picked,id].slice(-2);renderStats()}

  else if(d.fd!==undefined){fdoff=Math.min(0,fdoff+ +d.fd);selE=[];renderFood()}

  else if(d.fdf!==undefined){snap('Lebensmittel gelöscht');S.food=(S.food||[]).filter(f=>String(f.id)!==d.fdf);save();renderFood()}
  else if(d.fadd!==undefined){const nm=document.getElementById('fn').value.trim(),gr=num(document.getElementById('fg').value),fo=(S.food||[]).find(x=>x.n.toLowerCase()===nm.toLowerCase());if(!fo){toast('Lebensmittel nicht gefunden. Lege es unter „Meine Lebensmittel“ an.');return}if(!gr){toast('Trag die Gramm ein.');return}const dk=iso(new Date(new Date(today).setDate(today.getDate()+fdoff)));S.meals=S.meals||{};(S.meals[dk]=S.meals[dk]||[]).push({id:fid(),n:fo.n,g:gr,k:num(fo.k)*gr/100,p:num(fo.p)*gr/100,c:num(fo.c)*gr/100,f:num(fo.f)*gr/100});save();renderFood()}
  else if(d.fquick!==undefined){const gv=id=>num(document.getElementById(id).value);let kc=gv('fk');const pr=gv('fp'),cr=gv('fc'),fr=gv('ff'),nm=document.getElementById('fq').value.trim()||'Schnell';if(!kc&&!pr&&!cr&&!fr){toast('Trag mindestens kcal oder einen Nährwert ein.');return}if(!kc)kc=Math.round(4*pr+4*cr+9*fr);const dk=iso(new Date(new Date(today).setDate(today.getDate()+fdoff)));S.meals=S.meals||{};(S.meals[dk]=S.meals[dk]||[]).push({id:fid(),n:nm,k:kc,p:pr,c:cr,f:fr});save();renderFood()}
  else if(d.fsave!==undefined){const gv=id=>num(document.getElementById(id).value);const nm=document.getElementById('nfn').value.trim();let kc=gv('nfk');const pr=gv('nfp'),cr=gv('nfc'),fr=gv('nff');if(!nm||(!kc&&!pr&&!cr&&!fr)){toast('Name und mindestens kcal oder einen Nährwert pro 100 g eintragen.');return}if(!kc)kc=Math.round(4*pr+4*cr+9*fr);S.food=S.food||[];const old=S.food.find(x=>x.n.toLowerCase()===nm.toLowerCase());if(old){old.k=kc;old.p=pr;old.c=cr;old.f=fr}else S.food.push({id:fid(),n:nm,k:kc,p:pr,c:cr,f:fr});save();renderFood()}
  else if(d.wp!==undefined){setWarm(+d.wp,'init')}
  else if(d.wpp!==undefined){setWarm(+d.wpp,'add')}
  else if(d.wpm!==undefined){setWarm(+d.wpm,'del')}
  else if(d.bwgo!==undefined){S.ui=S.ui||{};S.ui.bw=true;save();view='st';render();setTimeout(()=>{const i=document.querySelector('input[data-bw]');if(i){i.scrollIntoView({block:'center'});i.focus()}},60)}
  else if(d.adopen!==undefined){addOpen=!addOpen;render()}
  else if(d.adok!==undefined){const nm=(document.getElementById('adin').value||'').trim(),cd=wdate(sel),dk=iso(cd);if(nm&&!exs(cd).includes(nm)){S.ad=S.ad||{};(S.ad[dk]=S.ad[dk]||[]).push(nm);save()}addOpen=false;render()}
  else if(d.adrm!==undefined){snap('Übung entfernt');const cd=wdate(sel),dk=iso(cd),i=+d.adrm-(S.plan[typeOf(cd)]||[]).length;if(S.ad&&S.ad[dk]&&i>=0){S.ad[dk].splice(i,1);save()}render()}
  else if(d.rec!==undefined){const e=RECENT[+d.rec];if(e){const dk=viewKey();S.meals=S.meals||{};(S.meals[dk]=S.meals[dk]||[]).push(cpE(e));save();renderFood()}}
  else if(d.fcopy!==undefined){snap('Einträge kopiert');const x=new Date(today);x.setDate(x.getDate()+fdoff-1);const src=(S.meals||{})[iso(x)]||[],dk=viewKey();S.meals=S.meals||{};const a=S.meals[dk]=S.meals[dk]||[];src.forEach(e=>a.push(cpE(e)));save();renderFood()}
  else if(d.tsave!==undefined){const nm=(document.getElementById('tn').value||'').trim();if(!nm){toast('Gib der Mahlzeit einen Namen.');return}const it=((S.meals||{})[viewKey()]||[]).filter(e=>selE.includes(String(e.id))).map(e=>({n:e.n,g:e.g,k:e.k,p:e.p,c:e.c,f:e.f}));if(!it.length)return;S.tpl=S.tpl||[];S.tpl.push({id:fid(),n:nm,items:it});selE=[];save();toast('Mahlzeit „'+nm+'“ gespeichert.');renderFood()}
  else if(d.tpl!==undefined){const t=(S.tpl||[])[+d.tpl];if(t){const dk=viewKey();S.meals=S.meals||{};const a=S.meals[dk]=S.meals[dk]||[];t.items.forEach(e=>a.push(cpE(e)));save();renderFood()}}
  else if(d.tdel!==undefined){snap('Mahlzeit gelöscht');S.tpl=(S.tpl||[]).filter(t=>String(t.id)!==d.tdel);save();renderFood()}
  else if(d.mr!==undefined){mrOff=Math.min(0,mrOff+ +d.mr);renderStats()}
  else if(d.rename!==undefined){const a=document.getElementById('rnold').value,b=(document.getElementById('rnnew').value||'').trim();if(renameEx(a,b)){toast('„'+a+'“ heißt jetzt „'+b+'“. Der Verlauf bleibt erhalten.');rerender()}}
  else if(d.sick!==undefined){
    const k=iso(wdate(sel));
    snap('Krank gemeldet');
    S.sick=S.sick||[];
    S.sick.push(k===iso(today)?{from:k,to:null}:{from:k,to:k});
    if(S.dt) delete S.dt[k]; // WICHTIG: Manuellen Typ löschen, damit die Zyklus-Pause greift!
    save();render();
  }
  else if(d.fit!==undefined){snap('Als gesund markiert');unsickDay(iso(wdate(sel)));if(S.dt) delete S.dt[iso(wdate(sel))];save();render()}
  else if(d.tg!==undefined){S.ui=S.ui||{};S.ui[d.tg]=!isOpen(d.tg);save();rerender()}
  else if(d.st!==undefined){const [ei,si,dir]=d.st.split(':').map(Number),cd=wdate(sel),ex=exs(cd)[ei],date=iso(cd),l=last(ex,date);markStart(date);const L=S.logs[date]=S.logs[date]||{};const a=L[ex]=L[ex]||initSets(ex,date);while(a.length<=si)a.push({});const lbm=S.lb&&S.lb[ex],stp={step:2.5,...S.prog}.step;let cur=num(a[si].w);if(!cur&&l.length)cur=num((l[si]||l[l.length-1]||{}).w);const nv=lbm?toKg(Math.max(0,(toLb(cur||0)||0)+dir*5)):Math.max(0,Math.round((cur+dir*stp)*100)/100);a[si].w=nv?String(nv):'';delete a[si].auto;save();checkPR(ex,si,date,ei);render()}
  else if(d.sw!==undefined){swapOpen=swapOpen===+d.sw?-1:+d.sw;render()}
  else if(d.swok!==undefined){const v=(document.getElementById('swin').value||'').trim(),cd=wdate(sel),date=iso(cd),og=orig(cd,swapOpen);if(v&&og){S.sw=S.sw||{};const m=S.sw[date]=S.sw[date]||{};if(v===og)delete m[og];else m[og]=v;save()}swapOpen=-1;render()}
  else if(d.swundo!==undefined){const cd=wdate(sel),og=orig(cd,+d.swundo),m=(S.sw||{})[iso(cd)];if(m&&og)delete m[og];save();swapOpen=-1;render()}
  else if(b.id==='cpb'){const txt=JSON.stringify(S);copyText(txt).then(ok=>{if(ok){S.bkd=iso(new Date());save();toast('Backup kopiert. Füge es jetzt in eine Notiz ein.');renderPlan()}else{document.getElementById('bk').value=txt;toast('Kopieren geht hier nicht. Der Text steht im Feld, kopiere ihn selbst.')}})}
  else if(d.ck!==undefined){const nm=S.chk.items[+d.ck],k=iso(today),a=S.chk.days[k]=S.chk.days[k]||[],ix=a.indexOf(nm);if(ix>=0)a.splice(ix,1);else a.push(nm);save();render()}
  else if(d.met!==undefined){pmet=d.met;rerender()}
  else if(d.fin!==undefined){const date=iso(wdate(sel));markStart(date);S.tm[date].e=Date.now();save();render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),60)}
  else if(d.unfin!==undefined){const t=tmOf(iso(wdate(sel)));if(t)delete t.e;save();render()}
  else if(d.cp!==undefined){const cd=wdate(sel),ex=exs(cd)[+d.cp],date=iso(cd),l=last(ex,date);if(l.length){markStart(date);const L=S.logs[date]=S.logs[date]||{};const a=L[ex]=L[ex]||initSets(ex,date);while(a.length<l.length)a.push({});l.forEach((q,i)=>{if(!q)return;if(!a[i].w&&q.w)a[i].w=q.w;if(!a[i].r&&q.r){a[i].r=q.r;delete a[i].auto}if(q.wu&&a[i].wu===undefined)a[i].wu=q.wu});save();render()}}
  else if(d.wu!==undefined){const q=d.wu.split(':').map(Number),cd=wdate(sel),ex=exs(cd)[q[0]],date=iso(cd);const L=S.logs[date]=S.logs[date]||{};const a=L[ex]=L[ex]||initSets(ex,date);while(a.length<=q[1])a.push({});a[q[1]].wu=!a[q[1]].wu;save();checkPR(ex,q[1],date,q[0]);render()}
  else if(d.lbp!==undefined){const ex=allEx()[+d.lbp];S.lb=S.lb||{};S.lb[ex]=!S.lb[ex];save();rerender()}
  else if(d.lb!==undefined){const ex=exs(wdate(sel))[+d.lb];S.lb=S.lb||{};S.lb[ex]=!S.lb[ex];save();render()}
  else if(d.add!==undefined||d.del!==undefined){
    const cd=wdate(sel),ei=+(d.add!==undefined?d.add:d.del),ex=exs(cd)[ei],date=iso(cd);
    const L=S.logs[date]=S.logs[date]||{};const a=L[ex]=L[ex]||initSets(ex,date);
    if(d.add!==undefined){const pv=[...a].reverse().find(x=>x&&!x.wu&&x.w)||a[a.length-1]||{};a.push(pv.w?{w:pv.w,auto:true}:{})}else if(a.length>1){snap('Satz entfernt');a.pop()}
    save();checkPR(ex,0,date,ei);render();
  }
  else if(b.id==='addc'){const k=cyIdx(today);S.cycle.push('Upper');setToday(k);renderPlan()}
  else if(b.id==='delc'&&S.cycle.length>1){const k=Math.min(cyIdx(today),S.cycle.length-2);S.cycle.pop();setToday(k);renderPlan()}
  else if(b.id==='ex'){document.getElementById('bk').value=JSON.stringify(S)}
  else if(b.id==='im'){try{const o=JSON.parse(document.getElementById('bk').value);if(o.plan&&o.cycle&&o.anchor&&o.logs){S=o;migrate();save();view='log';render()}}catch(err){alert('Backup nicht lesbar.')}}
});
document.getElementById('nl').onclick=()=>{view='log';render()};
document.getElementById('ne').onclick=()=>{view='fd';render()};
document.getElementById('ns').onclick=()=>{view='st';render()};
document.getElementById('np').onclick=()=>{view='plan';render()};
function refreshDay(){const n=new Date();if(iso(n)===iso(today))return;today=n;wd=(n.getDay()+6)%7;off=0;sel=wd;fdoff=0;calOff=0;rerender()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshDay()});
window.addEventListener('focus',refreshDay);window.addEventListener('pageshow',refreshDay);setInterval(refreshDay,60000);
const TABS=['log','st','fd','plan'];
function go(v,dir){view=v;swapOpen=-1;render();window.scrollTo(0,0);app.style.setProperty('--sx',(dir>0?36:-36)+'px');app.classList.remove('sw');void app.offsetWidth;app.classList.add('sw')}
let tx=0,ty=0,tt=0,swOk=false;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tt=Date.now();const el=e.target;swOk=e.touches.length===1&&tx>24&&tx<window.innerWidth-24&&!(el.closest&&el.closest('input,textarea,select'))},{passive:true});
document.addEventListener('touchend',e=>{if(!swOk)return;swOk=false;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6||Date.now()-tt>700)return;const n=TABS.indexOf(view)+(dx<0?1:-1);if(n<0||n>=TABS.length)return;go(TABS[n],dx<0?1:-1)},{passive:true});
render();
