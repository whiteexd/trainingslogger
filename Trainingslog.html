<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingslog</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trainingslog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F4F4F1;
    --mut:rgba(244,244,241,.6);
    --line:rgba(255,255,255,.08);
    --acc:#8B5CF6; /* Schönes Lila */
    --accTx:#C4B5FD;
    --accInk:#fff;
    --bg-card:#141414;
    --bg-input:#1C1C1E;
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px)
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:#000}
  
  #bgv2{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.55);transform:scale(1.25);z-index:-2;background:#000;pointer-events:none}
  #bgv{position:fixed;left:50%;top:50%;width:140vw;max-width:none;height:auto;transform:translate(-62%,-50%);z-index:-1;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 14%,#000 86%,transparent)}
  @media (min-aspect-ratio:1/1){#bgv{width:min(100vw,calc(100vh*1.06));transform:translate(-50%,-50%)}}
  
  html,body{margin:0;color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;font-weight:500;-webkit-font-smoothing:antialiased;background:#000}
  
  main{max-width:520px;margin:0 auto;padding:24px 16px 100px}
  
  /* Typografie */
  h1{font:700 36px/1.1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.5px;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 20px;font-size:15px}
  
  /* Navigation (Segmented Control Look) */
  .nav{display:flex;gap:4px;margin:0 0 24px;padding:4px;background:var(--bg-card);border-radius:16px;border:1px solid var(--line)}
  .nav .btn{flex:1;padding:10px 2px;font-size:14px;background:transparent;color:var(--mut);border-radius:12px;transition:all .2s}
  .nav .btn.pri{background:var(--acc);color:var(--accInk);font-weight:600;box-shadow:0 2px 10px rgba(139,92,246,.3)}
  
  /* Wochen-Auswahl */
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:20px}
  .week button{border:0;background:transparent;color:var(--ink);border-radius:14px;padding:10px 0;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .12s}
  .week button:active{transform:scale(.96)}
  .week b{font:600 16px "Barlow",sans-serif}
  .week small{font-size:11px;color:var(--mut);font-weight:500}
  .week .rest{opacity:.5}
  .week .on{background:var(--acc);color:var(--accInk)}
  .week .on small{color:var(--accInk);opacity:.8}
  .week .done b::after{content:"✓";font-size:11px;margin-left:2px;color:var(--accTx)}
  .week .on.done b::after{color:var(--accInk)}
  
  /* Karten */
  .ex,.today,.mt,.btn.cr{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  
  .ex h2{font:600 20px/1.2 "Barlow",sans-serif;margin:0 0 16px;letter-spacing:.2px}
  .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .hd h2{margin:0}
  .hd .btn{min-width:44px;padding:8px 12px;border-radius:12px;background:var(--bg-input)}
  .hd+.cv{color:var(--accTx);font-size:14px;font-weight:600}
  
  /* Sätze (Sets) */
  .set{display:grid;grid-template-columns:24px 1fr 16px 1fr 40px;gap:8px;align-items:start;margin-bottom:12px}
  .set span{color:var(--mut);padding-top:14px;font-size:15px;text-align:center}
  .set i{font-style:normal;color:var(--mut);text-align:center;padding-top:13px}
  input,textarea,select{font:inherit;color:var(--ink);background:var(--bg-input);border:1px solid transparent;border-radius:14px;padding:14px;width:100%;outline:0;transition:border-color .15s}
  input:focus,textarea:focus,select:focus{border-color:var(--accTx);background:#222}
  input::placeholder,textarea::placeholder{color:rgba(244,244,241,.3)}
  .set input{text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:12px 4px;min-width:0}
  .set input.auto{color:var(--mut)}
  select option{background:#1B1C1F;color:#fff}
  .cv{display:block;text-align:center;color:var(--mut);font-size:13px;min-height:14px;margin-top:4px}
  
  /* Buttons */
  .row{display:flex;gap:10px;margin-top:14px}
  .btn{border:1px solid var(--line);background:var(--bg-input);color:var(--ink);border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;transition:transform .12s,background .15s;display:flex;align-items:center;justify-content:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--acc);color:var(--accInk);border-color:transparent;box-shadow:0 4px 14px rgba(139,92,246,.25)}
  .btn.wu{padding:14px 0;min-width:0;border-radius:12px;font-size:14px;background:var(--bg-input)}
  .btn.wu.on{background:var(--acc);color:var(--accInk)}
  .btn.st{padding:0;width:34px;height:48px;flex:none;font-size:20px;line-height:1;border-radius:12px}
  
  /* Aufwärmen & Notiz */
  .note{margin:0 0 14px;padding:12px 14px;font-size:14px;text-align:left;border-radius:14px}
  
  /* Statistik Kacheln */
  .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
  .mt{background:var(--bg-card);border-radius:20px;padding:16px;border:1px solid var(--line);margin-bottom:0}
  .mt small{display:block;color:var(--mut);font-size:13px;margin-bottom:4px}
  .mt b{display:block;font:700 28px/1.1 "Barlow Condensed",sans-serif}
  .mt b span{font:500 13px Barlow,sans-serif;color:var(--mut)}
  .bar{height:8px;border-radius:4px;background:var(--bg-input);overflow:hidden;margin:10px 0 6px}
  .bar i{display:block;height:100%;background:var(--acc);border-radius:4px;transition:width .3s}
  
  /* Liste (Lebensmittel etc.) */
  .fe{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .fe:last-child{border-bottom:0}
  .fe span:first-child{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:500}
  .fe span:nth-child(2){color:var(--mut);font-size:13px;text-align:right;margin-right:8px}
  .btn.x{padding:6px 12px;font-size:16px;line-height:1;background:rgba(255,255,255,.05);border-radius:10px;flex:none}
  
  /* Kalender & Charts */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
  .cal b{font-weight:500;color:var(--mut);font-size:12px}
  .cd{padding:10px 0;border-radius:10px;font-variant-numeric:tabular-nums;color:var(--mut)}
  .cd.on{background:var(--acc);color:var(--accInk);font-weight:600}
  .cd.td{box-shadow:inset 0 0 0 2px var(--accTx)}
  .cd.sk{background:rgba(240,170,70,.2);color:#F0AA46}
  .ch{background:var(--bg-input);border-radius:16px;padding:16px;margin-top:12px;color:var(--ink)}
  
  /* Restday & Chips */
  .restbox{background:var(--bg-card);border:1px solid var(--line);border-radius:24px;padding:40px 20px;text-align:center;color:var(--mut);margin-bottom:16px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .btn.chip{padding:10px 16px;font-size:14px;border-radius:20px;background:var(--bg-input);border:1px solid var(--line)}
  .btn.cr{display:flex;justify-content:space-between;align-items:center;width:100%;margin:0 0 12px;padding:16px 20px;border-radius:20px;font-size:16px;box-shadow:none}
  .btn.cr small{color:var(--mut);font-weight:500;font-size:13px}
  .btn.cr.on{background:rgba(139,92,246,.15);border-color:var(--acc)}
  .btn.cr.on small{color:var(--accTx)}
  
  /* Header Widgets */
  .today{display:flex;flex-wrap:wrap;gap:8px 16px;padding:16px 20px;font-size:14px;margin-bottom:16px}
  .today b{font-weight:700;font-size:15px;width:100%;margin-bottom:4px;color:var(--accTx)}
  .today span{display:flex;align-items:center;gap:4px}
  .lnk{background:none;border:0;color:var(--accTx);font:inherit;padding:0;text-decoration:underline;cursor:pointer}
  
  /* Sonstiges */
  .wk{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;margin-bottom:12px}
  .pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
  .th{border:0;background:none;padding:0;color:var(--mut);font:inherit;font-size:12px;border-radius:12px;overflow:hidden}
  .th img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;display:block}
  .th.on img{outline:3px solid var(--accTx)}
  .prx{margin:0 0 16px;border-bottom:1px solid var(--line);padding-bottom:16px}
  .prx:last-child{border:0;margin:0;padding:0}
  .prx .hd b{font:600 18px/1.1 "Barlow",sans-serif}
  .sec{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--ink);padding:0;font:inherit;text-align:left;cursor:pointer}
  .sec h2{margin:0;font-size:20px}.sec span{color:var(--mut);font-size:18px}
  .sb{margin-top:20px}.sb>label:first-child{margin-top:0}
  label{display:block;margin:16px 0 8px;color:var(--mut);font-size:14px}
  .fe[data-sel]{cursor:pointer}.fe.sel{background:rgba(139,92,246,.15);border-radius:12px;padding-left:12px;padding-right:12px;border-color:transparent}
  
  /* Toast & Undo */
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translate(-50%,-160%);background:var(--acc);color:var(--accInk);padding:14px 20px;border-radius:16px;font-weight:600;z-index:10;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(139,92,246,.4)}
  #toast.show{transform:translate(-50%,0)}
  #undo{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translate(-50%,200%);display:flex;gap:14px;align-items:center;background:#222;color:#fff;padding:12px 16px 12px 20px;border-radius:16px;z-index:11;transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 30px rgba(0,0,0,.6);white-space:nowrap;border:1px solid var(--line)}
  #undo.show{transform:translate(-50%,0)}
  #undo button{background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:8px 16px;font:inherit;font-weight:600}
  
  @keyframes glow{0%{box-shadow:0 8px 24px rgba(0,0,0,.3)}25%{box-shadow:0 0 0 3px var(--accTx),0 0 40px rgba(139,92,246,.6)}100%{box-shadow:0 8px 24px rgba(0,0,0,.3)}}.ex.pop{animation:glow 1.8s ease-out}
  @keyframes sl{from{opacity:0;transform:translateX(var(--sx,30px))}to{opacity:1;transform:none}}#app.sw{animation:sl .22s ease-out}
</style>
</head>
